spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: notificaciones-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.backend.messaging.event
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8084}

app:
  # Mensajería: nombres centralizados (copia de infra/messaging-config.yml)
  messaging:
    topics:
      usuario-registrado: nexus.usuario.registrado
      orden-creada: nexus.orden.creada
      producto-eventos: nexus.producto.eventos
    dlt:
      usuario-registrado: nexus.usuario.registrado.DLT
      orden-creada: nexus.orden.creada.DLT
      producto-eventos: nexus.producto.eventos.DLT
    consumer-groups:
      notificaciones: nexus.notificaciones
      tickets: nexus.tickets
      inventario: nexus.inventario
    partitions: 3
    replication-factor: 1
    max-reintentos: 3

logging:
  level:
    root: INFO
    com.backend: DEBUG
    org.springframework.kafka: INFO

# =====================================================================
#  Monitoreo (Actuator + Prometheus). Ver MONITOREO_KAFKA.md
#  Solo se exponen health, info y prometheus; el resto de endpoints queda cerrado.
# =====================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
  health:
    kafka:
      enabled: ${MANAGEMENT_HEALTH_KAFKA_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    descripcion: Nexus Gaming - microservicio con Kafka
