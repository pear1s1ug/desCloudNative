spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: notificaciones-service

  # RabbitMQ (clúster de 2 nodos) + ACK manual de los consumidores
  rabbitmq:
    addresses: ${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASS}
    listener:
      simple:
        acknowledge-mode: manual        # el código decide ACK / NACK (ProcesadorConAck)
        prefetch: 1
        default-requeue-rejected: false # nunca reencolar en bucle
        concurrency: 1
        max-concurrency: 3

server:
  port: ${SERVER_PORT:8084}

app:
  # Mensajería: nombres centralizados (copia de infra/messaging-config.yml)
  messaging:
    exchanges:
      direct: nexus.direct
      topic: nexus.topic
      dlx: nexus.dlx
    queues:
      notificaciones: nexus.notificaciones.queue
      tickets: nexus.tickets.queue
      inventario: nexus.inventario.queue
    dlq:
      notificaciones: nexus.notificaciones.dlq
      tickets: nexus.tickets.dlq
      inventario: nexus.inventario.dlq
    routing-keys:
      usuario-registrado: usuario.registrado
      orden-creada: orden.creada
      producto-patron: producto.#
      producto-creado: producto.creado
      producto-actualizado: producto.actualizado
      producto-eliminado: producto.eliminado
      producto-stock-bajo: producto.stock.bajo
    ttl-ms: 30000
    dlq-ttl-ms: 86400000
    max-reintentos: 3

logging:
  level:
    root: INFO
    com.backend: DEBUG
    org.springframework.amqp: INFO
