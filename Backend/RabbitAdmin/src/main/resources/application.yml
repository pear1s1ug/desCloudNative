spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: kafkaadmin-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8085}

app:
  # Validación JWT (Azure AD)
  security:
    issuer: ${AZURE_ISSUER}
    jwk-set-uri: ${AZURE_JWKS_URI}
    audiences: ${AZURE_AUDIENCES}
    required-scope: ${AZURE_REQUIRED_SCOPE:access_as_user}

  # CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Mensajería: nombres centralizados (copia de infra/messaging-config.yml).
  # Aquí se usan para proteger los topics del sistema de borrados por la API.
  messaging:
    topics:
      usuario-registrado: nexus.usuario.registrado
      orden-creada: nexus.orden.creada
      producto-eventos: nexus.producto.eventos
    dlt:
      usuario-registrado: nexus.usuario.registrado.DLT
      orden-creada: nexus.orden.creada.DLT
      producto-eventos: nexus.producto.eventos.DLT
    consumer-groups:
      notificaciones: nexus.notificaciones
      tickets: nexus.tickets
      inventario: nexus.inventario
    partitions: 3
    replication-factor: 1
    max-reintentos: 3

# =====================================================================
#  Monitoreo (Actuator + Prometheus). Ver MONITOREO_KAFKA.md
#  Solo se exponen health, info y prometheus; el resto de endpoints queda cerrado.
# =====================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
  health:
    kafka:
      enabled: ${MANAGEMENT_HEALTH_KAFKA_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    descripcion: Nexus Gaming - microservicio con Kafka
