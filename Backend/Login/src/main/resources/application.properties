spring.config.import=optional:file:.env[.properties]
spring.application.name=login-service
server.port=${SERVER_PORT:8081}

# Microservicios a los que llama el BFF
app.services.productos-url=${PRODUCTOS_URL:http://localhost:8082}
app.services.usuarios-url=${USUARIOS_URL:http://localhost:8083}

# Validación JWT (Azure AD)
app.security.issuer=${AZURE_ISSUER}
app.security.jwk-set-uri=${AZURE_JWKS_URI}
app.security.audiences=${AZURE_AUDIENCES}
app.security.required-scope=${AZURE_REQUIRED_SCOPE:access_as_user}

# CORS: solo el origen del frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}