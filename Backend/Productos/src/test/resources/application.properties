spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.security.issuer=https://login.microsoftonline.com/test-tenant/v2.0
app.security.jwk-set-uri=https://login.microsoftonline.com/test-tenant/discovery/v2.0/keys
app.security.audiences=test-client-id
app.security.required-scope=access_as_user
app.cors.allowed-origins=http://localhost:5173
