# =====================================================================
#  Configuración de mensajería de referencia - Nexus Gaming (Kafka)
#  Dependencia Spring Boot 4: spring-boot-starter-kafka
#  Copiar este bloque, sin cambios, en el application.yml de:
#  Productos, Usuarios y Notificaciones (y KafkaAdmin para los recursos protegidos).
# =====================================================================

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.backend.messaging.event
        spring.json.use.type.headers: false

app:
  messaging:
    topics:
      usuario-registrado: nexus.usuario.registrado
      orden-creada: nexus.orden.creada
      producto-eventos: nexus.producto.eventos
    dlt:
      usuario-registrado: nexus.usuario.registrado.DLT
      orden-creada: nexus.orden.creada.DLT
      producto-eventos: nexus.producto.eventos.DLT
    consumer-groups:
      notificaciones: nexus.notificaciones
      tickets: nexus.tickets
      inventario: nexus.inventario
    partitions: 3
    replication-factor: 1
    max-reintentos: 3
