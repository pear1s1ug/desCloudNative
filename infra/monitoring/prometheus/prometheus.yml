# Prometheus - Nexus Gaming. Recargar sin reiniciar: curl -X POST http://localhost:9090/-/reload
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Lag de consumidores, offsets de topics (incluidos los .DLT) y brokers
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Microservicios Spring Boot (Actuator). Corren en Windows: host.docker.internal
  - job_name: servicios-nexus
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels: { servicio: productos }
      - targets: ["host.docker.internal:8083"]
        labels: { servicio: usuarios }
      - targets: ["host.docker.internal:8084"]
        labels: { servicio: notificaciones }
      - targets: ["host.docker.internal:8085"]
        labels: { servicio: kafkaadmin }